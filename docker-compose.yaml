services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: prod
    image: fsiot-backend:prod
    container_name: fsiot-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    extra_hosts:
      - "host-gateway:host-gateway"

    volumes:
      # Persist SQLite database on the host
      - ./backend/data:/app/backend/data
      - ./backend/.env:/app/backend/.env:ro

    env_file:
      - ./backend/.env

    environment:
      - NODE_ENV=production

    # Resource limits — sensible floor for a lightweight IoT backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Ensure container restarts are not too aggressive
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_MODE: prod
    image: fsiot-frontend:prod
    container_name: fsiot-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    environment:
      - NODE_ENV=production

    # Resource limits — lightweight frontend served by nginx
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 5s